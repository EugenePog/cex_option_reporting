[project]
name = "cex-option-reporting"
version = "0.1.0"
description = "Multi-tenant portal for CEX option strategy analytics: deals, PnL, balances, graphs."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Core / config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "typer>=0.12",              # app.cli entrypoints
    "tenacity>=8.3",           # retries against CEX APIs
    "cryptography>=42.0",      # Fernet encryption of CEX credentials

    # Database
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",    # Postgres driver
    "alembic>=1.13",           # migrations

    # Pipelines
    "pandas>=2.2",
    "duckdb>=1.0",             # optional analytical SQL accelerator
    "APScheduler>=3.10",       # daily scheduled collector

    # Ingestion / CEX
    "python-okx>=0.3.9",       # OKX SDK (as used in reference samples)
    "httpx>=0.27",             # REST calls not covered by the SDK

    # Web / auth
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9", # form posts
    "itsdangerous>=2.2",       # session cookies (Starlette SessionMiddleware)
    "bcrypt>=4.0",             # password hashing (used directly; passlib is unmaintained)
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "black>=24.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "types-requests",
]

[project.scripts]
cex = "app.cli:app"           # console entry: `cex collect`, `cex pipeline`, ...

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
